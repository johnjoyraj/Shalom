name: Build Shalom Kerala Stores Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Sync Web Assets to Android App
      run: |
        python3 sync_android_assets.py

    - name: Grant Execute Permission for Gradlew
      run: chmod +x android/gradlew

    - name: Build Debug APK with Gradle
      working-directory: android
      run: |
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ShalomKeralaStores-Debug-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Publish Direct APK Download to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: android-v1.0
        name: "Shalom Kerala Stores Android App v1.0"
        body: |
          ### 🌴 Shalom Kerala Stores Official Android App
          - **File**: `app-debug.apk`
          - **Install**: Download directly to your Android device and tap to install!
        files: android/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
